<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(lilita.woff2)}
@font-face{font-family:Rubik;src:url(rubik.woff2);font-weight:800}
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#2A1070}
.burst{position:absolute;left:50%;top:44%;width:1800px;height:1800px;margin:-900px 0 0 -900px;
  background:repeating-conic-gradient(from calc(var(--r,0) * 1deg),#3b1590 0 9deg,#2A1070 9deg 18deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%)}
.glow{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,rgba(125,255,106,.35),transparent 65%)}
.logo{position:absolute;top:26px;left:50%;width:200px;z-index:3;transform:translateX(-50%)}
.card{position:absolute;left:50%;top:232px;width:262px;transform:translateX(-50%) rotate(-3deg) scale(var(--s,1));border-radius:22px;
  border:6px solid #AEB6C2;box-shadow:0 0 0 4px #1a0b3d,0 18px 40px rgba(0,0,0,.55),0 0 60px rgba(157,255,90,.5);overflow:hidden}
.card img{display:block;width:100%}
.cost{position:absolute;left:50%;top:214px;margin-left:-160px;z-index:4;width:68px;height:68px;transform:rotate(-3deg) scale(var(--s,1));
  background:#7a2fe0;border:4px solid #1a0b3d;border-radius:50% 50% 50% 8%;display:flex;align-items:center;justify-content:center;
  font:44px Lilita;color:#fff;-webkit-text-stroke:5px #1a0b3d;paint-order:stroke fill;box-shadow:0 6px 0 #1a0b3d}
.t{position:absolute;left:0;right:0;text-align:center;font-family:Lilita;color:#fff;-webkit-text-stroke:8px #1a0b3d;paint-order:stroke fill;
  text-shadow:0 5px 0 #1a0b3d;text-transform:uppercase}
.name{top:590px;font-size:56px;color:#ffd84a}
.tag{top:658px;font-size:25px;padding:0 30px;line-height:1.15}
.tag b{color:#7dff6a;font-weight:normal}
.cta{position:absolute;left:50%;top:790px;transform:translateX(-50%);background:linear-gradient(#9c5cff,#6a28d8);border:4px solid #1a0b3d;
  border-radius:18px;padding:10px 34px 12px;font:34px Lilita;color:#fff;-webkit-text-stroke:6px #1a0b3d;paint-order:stroke fill;
  box-shadow:0 7px 0 #1a0b3d,inset 0 3px 0 rgba(255,255,255,.35);white-space:nowrap}
.url{top:876px;font-size:22px;color:#ffd84a;-webkit-text-stroke:5px #1a0b3d}
</style></head>
<body>
<div class="burst"></div><div class="glow"></div>
<img class="logo" src="logo.webp">
<div class="cost">3</div>
<div class="card"><img src="farter.webp"></div>
<div class="t name">Farter</div>
<div class="t tag">releases <b>toxic gas clouds</b><br>whatever stays inside <b>keeps taking damage</b><br>denies everything</div>
<div class="cta">PLAY FREE</div>
<div class="t url">memeroyale.imaginestudio.fun</div>
<script>
// frame-driven: window.F(t) sets the animation state at time t (s)
window.F = t => { const e = (x) => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
  document.documentElement.style.setProperty('--r', (t * 10).toFixed(2));
  const s = 0.6 + 0.4 * e(t / 0.35) + Math.sin(t * 2.4) * 0.012;
  document.querySelector('.card').style.setProperty('--s', s); document.querySelector('.cost').style.setProperty('--s', s);
  const show = (sel, at) => { const el = document.querySelector(sel), k = e((t - at) / 0.25); el.style.opacity = k; };
  show('.name', 0.25); show('.tag', 0.5); show('.cta', 0.8); show('.url', 0.8);
  const c = document.querySelector('.cta'); c.style.transform = `translateX(-50%) scale(${1 + Math.max(0, Math.sin((t - 1) * 5)) * 0.05 * (t > 1)})`;
};
</script>
</body></html>
