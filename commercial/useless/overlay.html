<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(./lilita.woff2)}
html,body{margin:0;background:transparent;overflow:hidden;width:540px;height:960px;font-family:Lilita,sans-serif}
.ol{-webkit-text-stroke:5px #1a0d2e;paint-order:stroke fill}
#clock{position:absolute;right:14px;top:16px;background:rgba(20,12,40,.82);border:3px solid #3b2a66;border-radius:14px;padding:4px 14px 6px;text-align:center;opacity:0}
#clock small{display:block;font-size:13px;color:#cbbdf0;letter-spacing:1px}
#clock b{display:block;font-size:34px;color:#fff;font-weight:400;line-height:1}
#clock.red b{color:#ff4d6d}
#big{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:170px;color:#fff;opacity:0;-webkit-text-stroke:10px #1a0d2e;paint-order:stroke fill}
.dmg{position:absolute;font-size:34px;color:#ffdf3a;transform:translate(-50%,-50%);-webkit-text-stroke:6px #2a1200;paint-order:stroke fill}
#hand{position:absolute;left:10px;right:10px;bottom:16px;height:232px;background:linear-gradient(#2a1b52,#1c1238);border:3px solid #4a3786;border-radius:18px;opacity:0;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#hand .next{position:absolute;left:12px;top:40px;width:62px;text-align:center;color:#cbbdf0;font-size:16px}
#hand .next .c{width:58px;height:78px;margin:6px auto 0;border-radius:8px;background:center/cover;border:2px solid #8e7fc0}
.card{position:absolute;top:22px;width:96px;height:132px;border-radius:12px;background:center/cover;border:3px solid #b9aef0;box-shadow:0 4px 0 #120a26}
.card .cost{position:absolute;left:-12px;top:-14px;width:36px;height:40px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#6a3fd0;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;-webkit-text-stroke:4px #22104a;paint-order:stroke fill}
.card .nm{position:absolute;left:0;right:0;bottom:-24px;text-align:center;color:#fff;font-size:15px;-webkit-text-stroke:4px #120a26;paint-order:stroke fill;white-space:nowrap}
.card.dim{filter:grayscale(1) brightness(.45)}
.card.glow{border-color:#ffd84a;box-shadow:0 0 22px 6px rgba(255,216,74,.85),0 4px 0 #120a26}
#cop{position:absolute;left:58px;right:16px;bottom:16px;height:20px;display:flex;gap:4px}
#cop i{flex:1;border-radius:6px;background:#3a2a6a;border:2px solid #22164a}
#cop i.on{background:linear-gradient(#d6a8ff,#9b5cf0)}
#drop{position:absolute;left:14px;bottom:8px;width:36px;height:42px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(#c58cff,#7a3fe0);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;-webkit-text-stroke:4px #2a124a;paint-order:stroke fill}
#tap{position:absolute;width:40px;height:40px;border-radius:50%;border:4px solid #fff;opacity:0;transform:translate(-50%,-50%)}
#vic{position:absolute;inset:0;opacity:0}
#vic .ribbon{position:absolute;left:-10px;right:-10px;top:24%;height:110px;background:linear-gradient(#ffe066,#f4a516);transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;border-top:6px solid #fff3b0;border-bottom:6px solid #9c5b00;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#vic .ribbon span{font-size:82px;color:#fff;-webkit-text-stroke:9px #6a3200;paint-order:stroke fill;letter-spacing:2px}
#vic .crowns{position:absolute;left:0;right:0;top:42%;text-align:center;color:#fff;font-size:40px}
#vic .mvp{position:absolute;left:50%;top:52%;transform:translateX(-50%);width:300px;background:rgba(30,18,64,.92);border:3px solid #c9a24a;border-radius:18px;padding:14px;text-align:center;color:#ffd84a;font-size:24px}
#vic .mvp .row{display:flex;justify-content:center;gap:16px;margin-top:10px}
#vic .mvp .m{width:96px;height:120px;border-radius:10px;background:center/cover;border:3px solid #ffd84a;position:relative}
#vic .mvp .m b{position:absolute;bottom:-26px;left:0;right:0;color:#fff;font-weight:400;font-size:16px;-webkit-text-stroke:4px #120a26;paint-order:stroke fill}
#vic .mvp .st{margin-top:34px;color:#cbbdf0;font-size:17px}
#deck{position:absolute;inset:0;opacity:0;background:linear-gradient(#24164a,#140c2c)}
#deck h1{position:absolute;left:0;right:0;top:9%;margin:0;text-align:center;color:#ffd84a;font-weight:400;font-size:46px;-webkit-text-stroke:7px #2a124a;paint-order:stroke fill}
#deck .grid{position:absolute;left:28px;right:28px;top:22%;height:420px}
#deck .slot{position:absolute;width:104px;height:140px;border-radius:12px;border:3px dashed rgba(200,180,255,.35)}
#deck .card{top:0}
#deck .one{position:absolute;color:#ffd84a;font-size:20px;-webkit-text-stroke:4px #2a124a;paint-order:stroke fill}
#hand2{position:absolute;width:70px;height:70px;opacity:0;transform:translate(-30%,-10%)}
#tag{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:52px;color:#fff;opacity:0;line-height:1.05;-webkit-text-stroke:8px #1a0d2e;paint-order:stroke fill}
#card{position:absolute;inset:0;opacity:0;background:#0b0716;overflow:hidden}
#art{position:absolute;inset:0;background:url(./g/bg_title_wide.webp) center/cover;filter:brightness(.5) saturate(1.1)}
#logo{position:absolute;left:50%;top:26%;width:400px;transform:translate(-50%,-50%)}
#tag2{position:absolute;left:0;right:0;top:47%;text-align:center;font-size:42px;color:#fff;-webkit-text-stroke:7px #000;paint-order:stroke fill;line-height:1.08}
#cta{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:#ffcf2e;color:#1a1030;font-size:34px;padding:10px 28px;border-radius:18px;box-shadow:0 6px 0 #9c6b00;white-space:nowrap}
#url{position:absolute;left:0;right:0;top:73%;text-align:center;font-size:26px;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill}
#black{position:absolute;inset:0;background:#000;opacity:0}
</style></head><body>
<div id="clock"><small>TIME LEFT</small><b>0:15</b></div>
<div id="big"></div>
<div id="dmgs"></div>
<div id="hand"><div class="next">NEXT<div class="c" style="background-image:url(./g/cards/giga.webp)"></div></div>
  <div class="card dim" style="left:84px;background-image:url(./g/cards/bonk.webp)"><div class="cost">3</div><div class="nm">BONK</div></div>
  <div class="card dim" style="left:190px;background-image:url(./g/cards/cate.webp)"><div class="cost">4</div><div class="nm">CATE</div></div>
  <div class="card dim" style="left:296px;background-image:url(./g/cards/walter.webp)"><div class="cost">4</div><div class="nm">WALTER</div></div>
  <div class="card" id="uc" style="left:402px;background-image:url(./g/cards/useless.webp)"><div class="cost">2</div><div class="nm">USELESS</div></div>
  <div id="drop">2</div><div id="cop"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
<div id="tap"></div>
<div id="vic"><div class="ribbon"><span>VICTORY</span></div><div class="crowns ol">2 &nbsp;-&nbsp; 1</div>
  <div class="mvp">MVP<div class="row"><div class="m" style="background-image:url(./g/cards/giga.webp)"><b>GIGA</b></div><div class="m" style="background-image:url(./g/cards/whale.webp)"><b>THE WHALE</b></div></div>
  <div class="st">23 CARDS PLAYED · 70 COPIUM SPENT</div></div></div>
<div id="deck"><h1>BATTLE DECK</h1><div class="grid" id="grid"></div></div>
<svg id="hand2" viewBox="0 0 64 64"><path d="M22 30V10a5 5 0 0 1 10 0v16l2-1V8a5 5 0 0 1 10 0v18l2 0V12a5 5 0 0 1 10 0v26c0 12-8 22-20 22-9 0-14-5-19-12L8 36a5 5 0 0 1 8-6z" fill="#fff" stroke="#1a0d2e" stroke-width="3"/></svg>
<div id="tag">NO CARD<br>IS USELESS.</div>
<div id="card"><div id="art"></div><img id="logo" src="./g/logo.png"><div id="tag2">NO CARD IS USELESS.</div>
<div id="cta">PLAY FREE</div><div id="url">memeroyale.imaginestudio.fun</div></div>
<div id="black"></div>
<script>
const $ = id => document.getElementById(id), clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), out3 = t => 1 - Math.pow(1 - clamp(t), 3);
const io = (t, a, b, f = 0.2) => clamp(Math.min((t - a) / f, (b - t) / f));
const DECK = ['giga', 'whale', 'bonk', 'cate', 'walter', 'troll', 'chillguy', 'useless'], NM = {giga: 'GIGA', whale: 'THE WHALE', bonk: 'BONK', cate: 'CATE', walter: 'WALTER', troll: 'TROLLFACE', chillguy: 'CHILL GUY', useless: 'USELESS'};
const COST = {giga: 6, whale: 7, bonk: 3, cate: 4, walter: 4, troll: 2, chillguy: 3, useless: 2};
const slotXY = i => [(i % 4) * 122, Math.floor(i / 4) * 200];
(async () => {
const TL = await (await fetch('./timeline.json')).json(); const END_ALL = TL.end + 3.0;
const grid = $('grid'), cards = {};
for (let i = 0; i < 8; i++) { const s = document.createElement('div'); s.className = 'slot'; const [x, y] = slotXY(i); s.style.left = x + 'px'; s.style.top = y + 'px'; grid.appendChild(s); }
DECK.forEach((k, i) => { const c = document.createElement('div'); c.className = 'card'; c.style.backgroundImage = `url(./g/cards/${k}.webp)`; c.innerHTML = `<div class="cost">${COST[k]}</div><div class="nm">${NM[k]}</div>`; c.style.width = '104px'; c.style.height = '140px'; grid.appendChild(c); cards[k] = c; });
const one = document.createElement('div'); one.className = 'one'; one.textContent = '#1'; grid.appendChild(one);
window.renderAt = t => {
  $('black').style.opacity = t < 0.7 ? 1 - t / 0.7 : 0;
  // match clock: 0:00 at the horn
  const inMatch = (t >= TL.arena[0] && t < TL.chosen) || (t >= TL.deploy && t < TL.horn + 1.6);
  const sec = Math.max(0, Math.ceil(TL.horn - t - 1e-6)); $('clock').style.opacity = inMatch ? 1 : 0;
  $('clock').querySelector('b').textContent = `0:${String(sec).padStart(2, '0')}`; $('clock').className = sec <= 5 ? 'red' : '';
  // the last five seconds, big in the middle (the game's countdown)
  const big = $('big'); const left = TL.horn - t;
  if (t >= TL.stand - 0.8 && left > 0 && left <= 5) { const n = Math.ceil(left), k = n - left; big.textContent = n; big.style.opacity = 0.55 * (1 - k * 0.6); big.style.transform = `scale(${1.25 - 0.25 * out3(k * 3)})`; }
  else if (left <= 0 && left > -1.2) { big.textContent = '0'; big.style.opacity = 0.8 * clamp(1 + left / 1.2); big.style.transform = 'scale(1.1)'; }
  else big.style.opacity = 0;
  // damage numbers
  $('dmgs').innerHTML = TL.events.filter(e => e.kind === 'dmg' && t >= e.t && t < e.t + 0.9).map(e => { const k = (t - e.t) / 0.9;
    return `<div class="dmg" style="left:${e.at[0] * 540}px;top:${e.at[1] * 960 - 60 * out3(k)}px;opacity:${1 - k * k}">${e.text}</div>`; }).join('');
  // the hand: only USELESS is affordable
  const h0 = 14.6, h1 = TL.chosen; $('hand').style.opacity = io(t, h0, h1, 0.15);
  $('hand').style.transform = `translateY(${(1 - out3((t - h0) / 0.3)) * 60}px)`;
  const pulse = 0.5 + 0.5 * Math.sin(t * 10), uc = $('uc'); uc.className = 'card' + (t > h0 + 0.5 ? ' glow' : '');
  const tapT = h0 + 1.2; uc.style.transform = t > tapT ? `translateY(${-24 * out3((t - tapT) / 0.2)}px) scale(${1 + 0.06 * out3((t - tapT) / 0.2)})` : `scale(${1 + 0.03 * pulse * (t > h0 + 0.5)})`;
  const tp = $('tap'); const tk = (t - tapT) / 0.35; tp.style.opacity = (tk >= 0 && tk < 1) ? 1 - tk : 0;
  tp.style.left = '472px'; tp.style.top = '820px'; tp.style.width = tp.style.height = (40 + 90 * tk) + 'px';
  // victory
  const v0 = TL.victory[0], v1 = v0 + 2.0; $('vic').style.opacity = io(t, v0, v1, 0.2);
  $('vic').querySelector('.ribbon').style.transform = `rotate(-4deg) scale(${0.6 + 0.4 * out3((t - v0) / 0.35)})`;
  // the deck: a thumb drags USELESS from the last slot to #1; GIGA moves down to its old slot
  const d0 = v1, d1 = TL.morning; $('deck').style.opacity = io(t, d0, d1, 0.2);
  const m = out3((t - d0 - 0.55) / 0.6);
  DECK.forEach((k, i) => { let [x, y] = slotXY(i);
    if (k === 'useless') { const [a, b] = slotXY(7), [c, d] = slotXY(0); x = a + (c - a) * m; y = b + (d - b) * m - 30 * Math.sin(Math.PI * clamp(m)); }
    if (k === 'giga') { const [a, b] = slotXY(0), [c, d] = slotXY(7); x = a + (c - a) * m; y = b + (d - b) * m; }
    cards[k].style.left = x + 'px'; cards[k].style.top = y + 'px'; cards[k].style.zIndex = k === 'useless' ? 5 : 1; });
  cards.useless.className = 'card' + (m > 0.98 ? ' glow' : ''); one.style.left = '28px'; one.style.top = '-30px'; one.style.opacity = clamp((t - d0 - 1.2) / 0.2);
  const h2 = $('hand2'); h2.style.opacity = io(t, d0 + 0.3, d0 + 1.35, 0.15);
  { const [a, b] = slotXY(7), [c, d] = slotXY(0); const k = clamp(m); h2.style.left = (28 + 60 + a + (c - a) * k) + 'px'; h2.style.top = (0.22 * 960 + 70 + b + (d - b) * k - 30 * Math.sin(Math.PI * k)) + 'px'; }
  // the line, then the end card
  $('tag').style.opacity = io(t, TL.end - 2.2, TL.end + 0.1, 0.35);
  const ec = TL.end; $('card').style.opacity = t >= ec ? clamp((t - ec) / 0.25) : 0;
  $('logo').style.transform = `translate(-50%,-50%) scale(${0.6 + 0.4 * out3((t - ec) / 0.45) + 0.02 * Math.sin(t * 3)})`;
  $('tag2').style.opacity = clamp((t - ec - 0.3) / 0.25); $('cta').style.opacity = clamp((t - ec - 0.8) / 0.25); $('url').style.opacity = clamp((t - ec - 1.0) / 0.25);
};
window.END_ALL = END_ALL;
await document.fonts.ready; window.ready = true;
})();
</script></body></html>
